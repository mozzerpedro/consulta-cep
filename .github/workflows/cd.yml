name: Continuous Delivery

on:
  push:
    branches: [main]

jobs:
    delivery:
        name: Delivery
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Continuous Delivery
              uses: actions/upload-artifact@v7
              with:
                name: projeto
                if-no-files-found: error
                path: |
                    src/**/*.js
                    package.json
                    package-lock.json
                    README.md
                    !test/**
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs: delivery

        steps:
            - name: Baixar artefato
              uses: actions/download-artifact@v8
              with:
                name: projeto
            
            - name: Exibir artefato
              run: ls -R