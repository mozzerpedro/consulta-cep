name: Continuous Delivery

on:
  push:
    branches: [main]

jobs:
    delivery:
        name: Delivery
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Continuous Delivery
              uses: actions/upload-artifact@v7
              with:
                name: projeto
                if-no-files-found: error
                path: |
                  src/**/*.js
                  package.json
                  package-lock.json
                  README.md
                  !test/**
